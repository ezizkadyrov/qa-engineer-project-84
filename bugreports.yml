---
- summary: |
    В списке категорий нельзя выбрать "без категории" после того, как выбрад какую-то категорию
  environment: |
    Яндекс Browser 26.8.2.1064 (64-bit)
    Windows 10 22H2
  steps-to-reproduce: |
    1. Зайти на сайт https://products-store.hexlet.app/
    2. Нажать на раскрывающийся список "Category"
    3. Выбрать любую категорию
    4. Опять нажать на раскрывающийся список "Category"
    5. Попытаться убрать категорию, чтобы увидеть все товары
  expected-result: |
    В списке категорий должно быть "none", что означало бы "без категории"
  actual-result: |
    В списке можно только выбрать какую-то одну категорию
